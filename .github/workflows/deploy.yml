# Save at: .github/workflows/deploy.yml

name: Auto News - 3 Sites

on:
  schedule:
    - cron: "0 */4 * * *"     # 6 runs/day, 1 article per enabled site per run
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-news-3-sites
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate one article per enabled site and rebuild sites
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python generate_news.py

      - name: Commit sites and state to main
        run: |
          mkdir -p sites state
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A sites state
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-publish: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi

      - name: Push each enabled site to its own branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IDS=$(python -c "import json; print(' '.join(s['id'] for s in json.load(open('sites_config.json')) if s.get('enabled')))")
          echo "Enabled: $IDS"
          for id in $IDS; do
            if [ ! -d "sites/$id" ]; then
              echo "skip $id (site folder not built)"
              continue
            fi
            tmp=$(mktemp -d)
            cp -r "sites/$id/." "$tmp/"
            (
              cd "$tmp"
              git init -q -b "site-$id"
              git add -A
              git -c user.name=news-bot -c user.email=news-bot@users.noreply.github.com \
                commit -qm "Update $id"
              git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "site-$id"
            )
          done

      - name: Telegram alert if run failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="News run failed: $RUN_URL" || true
